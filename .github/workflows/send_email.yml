name: 'Email Notification Workflow'

on:
  workflow_dispatch:
  schedule:
    - cron: 0 8 * * Mon

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Convert Notebook"
      run: |
        pip install jupyter
        pip install -r requirements.txt
        jupyter nbconvert --to html --execute analysis.ipynb --no-input
      - name: "Send Mail"
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          username: ${{secrets.GOOGLE_USERNAME}}
          password: ${{secrets.GOOGLE_APP_SECRET}}
          subject: Github Actions Test
          to: peter.hedman@gmail.com
          from: peter.hedman@gmail.com
          html_body: file:\\analysis.html
